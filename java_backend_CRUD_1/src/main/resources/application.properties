# Datasource. Production supplies these from deploy/app.env, so no credential is
# baked into the image or this file.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/carsale}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:carsale}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}
logging.level.org.hibernate=ERROR
spring.jpa.defer-datasource-initialization=true
# Request detail logging echoes credentials and payloads; keep it off by default.
spring.mvc.log-request-details=${LOG_REQUEST_DETAILS:false}

# CORS allow list. Exact origins, comma separated. Never a wildcard in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Creates the sam/admin development accounts, both with the password "man", on
# every startup. admin holds ROLE_ADMIN and can delete any user. Local only.
app.seed-default-users=${SEED_DEFAULT_USERS:false}

# Health endpoint for the container health check. Not proxied from the edge.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Do not leak stack traces or internals in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# RSA keypair for JWT signing. Mounted at runtime in production; the classpath
# default is for local development only and those files are gitignored.
rsa.private-key=${RSA_PRIVATE_KEY:classpath:certification/private.pem}
rsa.public-key=${RSA_PUBLIC_KEY:classpath:certification/public.pem}
