# Public edge for the Car Sale Application.
# Serves the compiled React bundle and reverse-proxies the API paths to the
# Spring Boot container. Included from nginx.conf's http block via conf.d/.

# Cloudflare Tunnel is the only client, so the real visitor IP arrives in
# X-Forwarded-For rather than the socket address. Rate limiting keys off it.
map $http_x_forwarded_for $client_ip {
    default                 $remote_addr;
    "~^(?P<first>[^,\s]+)"  $first;
}

limit_req_zone  $client_ip zone=carsale_api:10m  rate=20r/s;
limit_req_zone  $client_ip zone=carsale_auth:10m rate=1r/s;
limit_conn_zone $client_ip zone=carsale_conn:10m;

upstream carsale_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Payloads are small JSON objects; nothing here accepts uploads.
    client_max_body_size  16k;
    client_body_timeout   10s;
    client_header_timeout 10s;

    limit_conn carsale_conn 24;
    server_tokens off;

    include /etc/nginx/carsale-headers.conf;

    # ---- authentication endpoints (tight limit) ---------------------------
    location = /jwt-token  { limit_req zone=carsale_auth burst=5 nodelay; include /etc/nginx/carsale-proxy.conf; }
    location = /basic-auth { limit_req zone=carsale_auth burst=5 nodelay; include /etc/nginx/carsale-proxy.conf; }
    location = /addUser    { limit_req zone=carsale_auth burst=5 nodelay; include /etc/nginx/carsale-proxy.conf; }

    # ---- application API --------------------------------------------------
    location ^~ /cars      { limit_req zone=carsale_api burst=40 nodelay; include /etc/nginx/carsale-proxy.conf; }
    location ^~ /users     { limit_req zone=carsale_api burst=40 nodelay; include /etc/nginx/carsale-proxy.conf; }
    location ^~ /deleteCar { limit_req zone=carsale_api burst=40 nodelay; include /etc/nginx/carsale-proxy.conf; }
    location = /addCar     { limit_req zone=carsale_api burst=40 nodelay; include /etc/nginx/carsale-proxy.conf; }
    location = /addAllCars { limit_req zone=carsale_api burst=40 nodelay; include /etc/nginx/carsale-proxy.conf; }
    location = /updateCar  { limit_req zone=carsale_api burst=40 nodelay; include /etc/nginx/carsale-proxy.conf; }
    location = /logout     { limit_req zone=carsale_api burst=40 nodelay; include /etc/nginx/carsale-proxy.conf; }
    location = /error      { limit_req zone=carsale_api burst=40 nodelay; include /etc/nginx/carsale-proxy.conf; }

    # Actuator backs the container health check only. It is never proxied from
    # the edge, so nothing under /actuator is publicly reachable.

    # ---- static bundle ----------------------------------------------------
    # Hashed CRA assets are immutable and safe to cache hard.
    location /static/ {
        include /etc/nginx/carsale-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/carsale-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # React Router owns every remaining path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
