name: Security Gates

# No path filters, deliberately. A supply-chain gate that skips depending on
# which files a change touched is not a gate. Every pull request and every push
# to main runs all three scans.
#
# This complements the `secrets` job in ci.yml rather than replacing it. That
# one asserts no key or database file is TRACKED, which is a tip-of-tree check.
# This one reads history and file contents, which is a different question.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  CHECKOV_IMAGE: "ghcr.io/bridgecrewio/checkov:3.3.13"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --output gitleaks.tar.gz "$url"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      # Full history, not only the diff. SECURITY.md records credential material
      # that is permanent in this repository's history, so a diff-only scan
      # would pass while it is still reachable. Findings that are known,
      # neutralised and documented belong in .gitleaksignore with a dated
      # reason, which is a record of judgement. Silence is not.
      # --redact keeps any hit out of the public run log.
      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          gitleaks git . --no-banner --redact --verbose --exit-code 1 --report-format json --report-path gitleaks-report.json

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 30

  deps:
    name: Dependency and container scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ignore-unfixed is deliberately not set. A CVE with no upstream fix is
      # allowlisted by hand in .trivyignore with a dated reason, so the
      # judgement is recorded. Blanket-hiding unfixed findings would erase it.
      # This covers both trees: react_frontend/package-lock.json and the Maven
      # pom under java_backend_CRUD_1.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          output: trivy-fs.txt
          trivyignores: .trivyignore
          hide-progress: "true"

      # Both images build straight from the repository root, which is the
      # context compose uses, so there is nothing to stage.
      - name: Build the API image
        if: always()
        run: docker build --file deploy/api.Dockerfile --tag carsale-api:scan .

      # A green dependency scan says the jar contains no known-vulnerable
      # library. It says nothing about whether the application still starts,
      # and the Spring Boot version that produces those libraries was raised
      # from 3.1.3 to 3.5.16 to clear them. The unit suite cannot answer this
      # either: it needs a live MySQL, which is why ci.yml skips it.
      #
      # So bring up the real dependency and ask the real application. This is
      # the difference between "the upgrade compiles" and "the upgrade runs".
      - name: Smoke test the API image against a real database
        if: always()
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force carsale-api-smoke carsale-db-smoke > /dev/null 2>&1 || true
            docker network rm carsale-smoke > /dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create carsale-smoke > /dev/null
          docker run --detach --name carsale-db-smoke --network carsale-smoke --network-alias db \
            --env MYSQL_ROOT_PASSWORD=smokeroot \
            --env MYSQL_DATABASE=carsale \
            --env MYSQL_USER=carsale \
            --env MYSQL_PASSWORD=smokepass \
            mysql:8.0 > /dev/null

          for attempt in $(seq 1 60); do
            if docker exec carsale-db-smoke mysqladmin ping -h 127.0.0.1 -u root -psmokeroot --silent > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          # Throwaway signing keys. The image never carries any, by design.
          keys="$RUNNER_TEMP/smoke-keys"
          mkdir -p "$keys"
          openssl genrsa -out "$keys/keypair.pem" 2048 2> /dev/null
          openssl rsa -in "$keys/keypair.pem" -pubout -out "$keys/public.pem" 2> /dev/null
          openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in "$keys/keypair.pem" -out "$keys/private.pem"
          chmod 644 "$keys"/*.pem

          docker run --detach --name carsale-api-smoke --network carsale-smoke \
            --volume "$keys:/run/keys:ro" \
            --env SPRING_DATASOURCE_URL='jdbc:mysql://db:3306/carsale?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' \
            --env SPRING_DATASOURCE_USERNAME=carsale \
            --env SPRING_DATASOURCE_PASSWORD=smokepass \
            --env APP_CORS_ALLOWED_ORIGINS=http://localhost \
            --env RSA_PRIVATE_KEY=file:/run/keys/private.pem \
            --env RSA_PUBLIC_KEY=file:/run/keys/public.pem \
            --publish 18081:8080 \
            carsale-api:scan > /dev/null

          for attempt in $(seq 1 60); do
            body="$(curl --silent --max-time 5 http://127.0.0.1:18081/actuator/health || true)"
            case "$body" in
              *'"status":"UP"'*)
                echo "API reports UP on Spring Boot $(grep -m1 -A4 '<parent>' java_backend_CRUD_1/pom.xml | grep -oE '3\.[0-9.]+')"
                exit 0
                ;;
            esac
            sleep 3
          done

          echo "API never reported UP. Container logs:"
          docker logs carsale-api-smoke 2>&1 | tail -60
          exit 1

      - name: Trivy image scan, API
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: carsale-api:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          output: trivy-image-api.txt
          trivyignores: .trivyignore
          hide-progress: "true"

      - name: Build the web image
        if: always()
        run: docker build --file deploy/web.Dockerfile --tag carsale-web:scan .

      # The web image runs as a non-root user, which a build cannot prove. nginx
      # writing its pid or its cache fails at START, not at build, so without
      # this the gate would pass an image that never serves a request. Hardening
      # nobody has watched run is a guess.
      - name: Smoke test the web image actually serves
        if: always()
        run: |
          set -euo pipefail
          # --add-host is required, not incidental. nginx resolves every
          # upstream at config-parse time, so default.conf's `api:8080` has to
          # exist as a name or the master exits with "host not found in
          # upstream" before serving anything. In the real stack compose
          # provides it. /healthz is answered by nginx itself and never
          # proxied, so pointing the name at loopback is enough to start.
          docker run --detach --name carsale-web-smoke \
            --add-host api:127.0.0.1 \
            --publish 18080:8080 carsale-web:scan
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:18080/healthz; then
              echo "web image serves /healthz as $(docker exec carsale-web-smoke id -un)"
              docker rm --force carsale-web-smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "web image never served /healthz. Container logs:"
          docker logs carsale-web-smoke || true
          docker rm --force carsale-web-smoke > /dev/null
          exit 1

      - name: Trivy image scan, web
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: carsale-web:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          output: trivy-image-web.txt
          trivyignores: .trivyignore
          hide-progress: "true"

      # Every scan writes to a file so the reports survive as artifacts. Print
      # them too, otherwise a failing gate says nothing in the run log.
      - name: Print scan reports
        if: always()
        run: |
          for report in trivy-fs.txt trivy-image-api.txt trivy-image-web.txt; do
            echo "===== $report ====="
            if [ -s "$report" ]; then
              cat "$report"
            else
              echo "no findings at HIGH or CRITICAL"
            fi
          done

      - name: Upload trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-fs.txt
            trivy-image-api.txt
            trivy-image-web.txt
          if-no-files-found: warn
          retention-days: 30

  iac:
    name: IaC misconfiguration scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run the pinned checkov image directly rather than through the action, so
      # the exact flags are visible here. --skip-download keeps the run offline
      # and deterministic: nothing about this public repository is sent anywhere.
      #
      # Checkov has no docker_compose framework, verified against 3.3.13's own
      # valid-framework list, so compose.yaml and the two docker-compose.yml
      # files are not covered here and stay a manual review. github_actions is
      # in scope instead: an unpinned action or an injectable workflow
      # expression is a supply-chain risk in the same family.
      #
      # gitlab_ci is in scope too, so that .gitlab-ci.yml is checked on the
      # side that reviews changes to it. Without it a change to the GitLab
      # pipeline merges here unscanned and is only checked once it has already
      # landed on main and been mirrored. Be honest about the size of that
      # framework: 14 checks against 144 from github_actions, and one of its
      # four rules can never fire on a GitLab file at all.
      #
      # CKV_IGNORE_HIDDEN_DIRECTORIES=false is not cosmetic. Checkov skips
      # dot-directories by default, which was proved on cube-store: a Dockerfile
      # with no USER and no HEALTHCHECK passed cleanly inside a dot-directory
      # and failed immediately once moved to a visible path.
      # .devcontainer/Dockerfile is the common real case that would otherwise
      # never be scanned. .git is skipped explicitly, since walking the object
      # store finds nothing and costs time.
      - name: Checkov
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            --env CKV_IGNORE_HIDDEN_DIRECTORIES=false "$CHECKOV_IMAGE" \
            --directory . \
            --framework dockerfile kubernetes github_actions gitlab_ci \
            --skip-path node_modules \
            --skip-path '^\.git/' \
            --skip-download \
            --compact \
            --quiet \
            --output cli | tee checkov-report.txt

      - name: Upload checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.txt
          if-no-files-found: warn
          retention-days: 30
