name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react_frontend/package-lock.json

      - run: npm ci

      # Empty means same-origin, matching how the hosted bundle is built.
      - name: Build
        run: npm run build
        env:
          REACT_APP_API_URL: ""
          CI: true

      - name: Assert no backend host was baked into the bundle
        run: |
          if grep -rlE 'localhost:8080|40\.76\.224\.112|34\.148\.248\.82' build/static/js/; then
            echo "A backend host is compiled into the bundle; the API base URL must stay same-origin."
            exit 1
          fi
          echo "No absolute backend host in the bundle."

  backend:
    name: Build Spring Boot API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java_backend_CRUD_1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Signing keys are gitignored, so generate a throwaway pair for the build.
      # Tests are skipped: the suite needs a live MySQL, which CI does not run.
      - name: Generate build-only RSA keypair
        run: |
          mkdir -p src/main/resources/certification
          cd src/main/resources/certification
          openssl genrsa -out keypair.pem 2048
          openssl rsa -in keypair.pem -pubout -out public.pem
          openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt \
            -in keypair.pem -out private.pem

      - name: Package
        run: mvn -B -ntp clean package -DskipTests

  secrets:
    name: Check for committed credential material
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository has shipped a private key and a MySQL data directory
      # before. Both are gitignored now; this fails the build if either returns.
      - name: Assert no keys or database files are tracked
        run: |
          tracked=$(git ls-files -- '*.pem' '*.key' '.db/**' 'deploy/app.env' 'deploy/keys/**' '**/*.ibd')
          if [ -n "$tracked" ]; then
            echo "Credential or database material is tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "No key or database files tracked."
